version: '3.8'

# Uso:
#   Levantar:   docker-compose up -d --build
#   Ver logs:   docker-compose logs -f backend
#   Detener:    docker-compose down
#
# Requisito: la red betgo_network y el contenedor betgo_postgres
# deben estar corriendo (ver infra/docker-compose.yml)

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: betgo_backend
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: betgo_postgres
    ports:
      - "3000:3000"
    networks:
      - betgo_network

networks:
  betgo_network:
    external: true
